<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Montserrat:wght@500;600&amp;display=swap');

      .meo-didone {
        font-family: 'Playfair Display', 'Cormorant Garamond', 'Bodoni MT', 'Didot', 'Times New Roman', serif;
        font-weight: 700;
        fill: #000000;
      }
      .meo-subtitle {
        font-family: 'Montserrat', 'Century Gothic', 'DejaVu Sans', 'Liberation Sans', sans-serif;
        font-weight: 600;
        fill: #000000;
        letter-spacing: 0.085em;
      }
    </style>
  </defs>

  <!-- Clean pure white canvas -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- 1. LEFT ORGANIC DUSTY BLUSH BLOB -->
  <!-- Exact shade & shape from original logo -->
  <path
    d="M 285 295
       C 345 285, 410 320, 430 375
       C 450 425, 410 470, 445 520
       C 465 550, 450 580, 405 592
       C 350 605, 275 605, 210 580
       C 155 555, 140 490, 150 435
       C 160 375, 225 380, 240 335
       C 250 310, 265 298, 285 295 Z"
    fill="#E2A4B1"
  />

  <!-- 2. RIGHT ORGANIC SLATE GRAY BLOB -->
  <!-- Exact shade & shape behind O and subtitle -->
  <path
    d="M 535 555
       C 605 530, 725 525, 798 565
       C 868 605, 868 675, 845 730
       C 818 795, 715 800, 620 782
       C 545 768, 505 722, 515 658
       C 520 612, 495 572, 535 555 Z"
    fill="#A9ACB3"
  />

  <!-- 3. RECLINING WOMAN - ONE-LINE ART CONTOUR -->
  <!-- Smooth, organic curved silhouette (NOT angular mountains) -->
  <g stroke="#000000" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Outstretched left foot and front of calf sweeping up to the knee -->
    <path d="M 235 432
             C 248 431, 272 422, 305 410
             C 345 395, 375 365, 396 340
             C 418 312, 430 294, 438 288" />
             
    <!-- Foot sole and toes contour on the far left -->
    <path d="M 235 432
             C 240 437, 252 434, 265 428
             C 290 417, 335 408, 370 395" />
             
    <!-- Rounded knee apex and smooth thigh curving down to the hip -->
    <path d="M 438 288
             C 445 285, 452 288, 458 296
             C 472 328, 485 368, 498 402
             C 504 420, 508 428, 510 432" />

    <!-- Second bent leg (resting with foot on top of M) -->
    <path d="M 345 432
             C 350 426, 360 424, 372 430" />
    <path d="M 345 432
             C 348 418, 358 408, 370 405
             C 382 400, 392 378, 404 356
             C 414 334, 424 314, 432 292" />
             
    <!-- Inner thigh contour -->
    <path d="M 400 374 C 412 364, 432 348, 448 354" />
    <path d="M 465 378 C 474 394, 482 414, 490 428" />

    <!-- Torso: Buttocks, waist and arched spine -->
    <path d="M 510 432
             C 525 432, 545 426, 575 426
             C 610 426, 635 424, 655 420" />

    <!-- Belly line into breast curve -->
    <path d="M 495 428
             C 508 424, 528 422, 545 423
             C 565 424, 578 422, 595 415
             C 615 408, 630 394, 642 378" />

    <!-- Breast swells: primary breast swell -->
    <path d="M 642 378
             C 650 370, 660 370, 668 376
             C 675 383, 680 395, 690 402" />

    <!-- Second breast swell behind -->
    <path d="M 662 370
             C 670 366, 682 370, 690 378" />

    <!-- Relaxed arm along the torso -->
    <path d="M 645 418
             C 630 422, 595 426, 560 426
             C 545 426, 535 428, 525 432" />

    <!-- Shoulder, nape and back of neck -->
    <path d="M 655 420
             C 672 418, 690 414, 708 411
             C 722 409, 735 411, 745 417" />

    <!-- Throat line to chin -->
    <path d="M 690 402
             C 705 403, 720 399, 732 393" />

    <!-- Tilted facial profile: chin, lips, nose, forehead -->
    <path d="M 732 393
             C 738 389, 744 387, 748 385
             C 752 382, 755 382, 758 385
             C 760 387, 762 392, 760 397" />

    <!-- Hair streaming back and cascading down over letter O -->
    <path d="M 758 385
             C 768 395, 782 407, 800 419
             C 815 429, 828 437, 836 445" />

    <!-- Under-curve of hair -->
    <path d="M 745 417
             C 760 421, 780 429, 805 437
             C 820 441, 830 445, 836 445" />

    <!-- Inner hair strand texture -->
    <path d="M 765 405 C 785 417, 810 429, 825 439" />
    <path d="M 750 412 C 770 421, 795 431, 818 441" />
  </g>

  <!-- 4. "MEO" PRECISE DIDONE LETTERING -->
  <!-- Exactly matching the original typography proportions in Image 1 -->
  <g fill="#000000">
    <!-- M -->
    <path d="
      M 205 436 L 255 436 L 255 442 L 241 442 L 241 614 L 257 614 L 257 620 L 205 620 L 205 614 L 221 614 L 221 442 L 205 442 Z
      M 221 442 L 327 618 L 333 618 L 439 442 L 423 442 L 423 436 L 457 436 L 457 442 L 441 442 L 441 614 L 457 614 L 457 620 L 405 620 L 405 614 L 421 614 L 421 452 L 335 620 L 325 620 L 239 452 L 239 442 Z
    "/>
    <!-- E -->
    <path d="
      M 480 436 L 582 436 L 582 470 L 574 470 L 571 446 L 516 446 L 516 520 L 564 520 L 564 532 L 516 532 L 516 610 L 578 610 L 582 586 L 590 586 L 590 620 L 480 620 L 480 614 L 496 614 L 496 442 L 480 442 Z
    "/>
    <!-- O -->
    <path d="
      M 724 432
      C 786 432, 824 476, 824 527
      C 824 578, 786 622, 724 622
      C 662 622, 624 578, 624 527
      C 624 476, 662 432, 724 432 Z
      M 724 438
      C 682 438, 656 477, 656 527
      C 656 577, 682 616, 724 616
      C 766 616, 792 577, 792 527
      C 792 477, 766 438, 724 438 Z
    "/>
  </g>

  <!-- 5. SUBTITLE TEXT -->
  <!-- Centered geometric sans-serif -->
  <g class="meo-subtitle" font-size="31.5" text-anchor="middle">
    <text x="500" y="682">СТУДИЯ КОРРЕКЦИИ ФИГУРЫ И</text>
    <text x="500" y="726">ЭСТЕТИЧЕСКОЙ КОСМЕТОЛОГИИ</text>
  </g>
</svg>
