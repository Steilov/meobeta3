      .meo-sub-text {
        font-family: 'Outfit', 'Plus Jakarta Sans', 'Montserrat', 'Century Gothic', -apple-system, sans-serif;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="#FFFFFF" rx="0"/>

  <!-- 1. LEFT ORGANIC MAUVE/ROSE BLOB (Behind left legs and M) -->
  <path
