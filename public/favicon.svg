    <!-- Shoulder, nape and back of neck -->
    <path d="M 655 422
             C 672 420, 690 415, 708 412
             C 722 410, 735 412, 745 418" />

    <!-- Front throat line -->
    <path d="M 690 405
             C 705 406, 720 402, 732 396" />

