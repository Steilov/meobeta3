  <g stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Outstretched left foot and lower leg -->
    <!-- Shin from ankle up to knee -->
    <path d="M 228 428
             C 242 427, 268 420, 305 410
