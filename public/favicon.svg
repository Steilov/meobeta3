    <!-- Thigh shadows & inner contours -->
    <path d="M 400 375 C 412 365, 435 348, 452 355" />
    <path d="M 470 380 C 478 395, 485 415, 492 428" />

    <!-- Glute, waist, and arched spine -->
    <path d="M 510 432
